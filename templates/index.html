{% extends "layout.html" %}

{% block title %}Library{% endblock %}

{% block content %}
    <div class="game-grid-container">
        <div style="margin-bottom: 2rem;">
            <h1>Game Library</h1>
            <p style="color: var(--text-secondary);">Select a game to start playing.</p>
        </div>

        <div class="game-grid">
            {% for game in games %}
            <a href="{{ url_for('main.play_game', game_id=game.id) }}" class="game-item">
                <img src="{{ game.thumb }}" alt="{{ game.title }}" onerror="this.src='https://placehold.co/600x400/313244/FFF?text={{ game.title }}'">
                <div class="game-title">{{ game.title }}</div>
            </a>
            {% endfor %}
            
            </div>
    </div>
{% endblock %}
