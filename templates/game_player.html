{% extends "layout.html" %}

{% block title %}Playing: {{ title | capitalize }}{% endblock %}

{% block content %}
    <div class="game-player-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>{{ title | capitalize }}</h2>
            <a href="{{ url_for('main.home') }}" class="btn" style="background-color: var(--card-bg); color: white;">&larr; Exit</a>
        </div>

        <iframe src="{{ game_url }}" class="game-iframe" style="width: 100%; height: 75vh; border: none; border-radius: 12px; background: black;"></iframe>
    </div>
{% endblock %}
