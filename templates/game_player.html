{% extends "layout.html" %}

{% block title %}Playing: {{ title | capitalize }}{% endblock %}

{% block content %}
    <div class="game-player-container">
        <h2>Playing: {{ title | capitalize }}</h2>
        <p>Your game is loading below. Your score will be saved automatically!</p>
        
        <!-- 
          This iframe loads your Pygbag game.
          The 'game_url' comes from the 'play_game' route in app.py
        -->
        <iframe src="{{ game_url }}" class="game-iframe"></iframe>

        <div class="game-controls">
            <!-- Fixed URL to main.home -->
            <a href="{{ url_for('main.home') }}" class="btn">Back to Game Selection</a>
        </div>
    </div>
{% endblock %}
